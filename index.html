const categories=document.getElementById("categories");
const videoList=document.getElementById("video-list");
const player=document.getElementById("player");
const imageViewer=document.getElementById("imageViewer");

function createCategories(){
  categories.innerHTML="";
  ["Vidéos","Images"].forEach((name,index)=>{
    const btn=document.createElement("button");
    btn.textContent=name;
    btn.className="cat-btn";
    btn.onclick=()=>loadCategory(index===0?"video":"image",btn);
    categories.appendChild(btn);
  });
}

function loadCategory(type,btn){
  if(!unlocked){
    alert("🔒 Accès bloqué. Entrer le code.");
    return;
  }
  currentType=type;
  currentList=type==="video"?videoLinks:imageLinks;
  currentIndex=0;
  document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  videoList.innerHTML="";
  if(!currentList.length){
    videoList.innerHTML='<div class="empty">Aucun élément dans cette catégorie.</div>';
    return;
  }
  currentList.forEach((url,index)=>{
    const item=document.createElement("div");
    item.className="video-item";
    const name=document.createElement("span");
    name.textContent=(type==="video"?"🎬 Vidéo ":"🖼️ Image ")+(index+1);
    const button=document.createElement("button");
    button.className="play-btn";
    button.textContent=type==="video"?"▶ Lire":"👁️ Voir";
    button.onclick=()=>{currentIndex=index;loadMedia();};
    item.appendChild(name);
    item.appendChild(button);
    videoList.appendChild(item);
  });
  loadMedia();
}

function checkCode(){
  const code=document.getElementById("accessCode").value.trim();
  if(validCodes.includes(code)){
    unlocked=true;
    document.getElementById("lockScreen").style.display="none";
    loadCategory("video",document.querySelector(".cat-btn"));
  }else{
    document.getElementById("errorMsg").innerText="❌ Code incorrect";
  }
}

function loadMedia(){
  if(!currentList.length || !currentList[currentIndex]) return;
  const url=currentList[currentIndex];
  if(currentType==="video"){
    imageViewer.style.display="none";
    player.style.display="block";
    player.src=url;
    player.load();
    player.play().catch(()=>{});
  }else{
    player.pause();
    player.removeAttribute("src");
    player.load();
    player.style.display="none";
    imageViewer.style.display="block";
    imageViewer.src=url;
  }
}

function next(){
  if(currentIndex<currentList.length-1){currentIndex++;loadMedia();}
}
function prev(){
  if(currentIndex>0){currentIndex--;loadMedia();}
}
function goFullScreen(){
  const elem=document.getElementById("player-container");
  if(elem.requestFullscreen) elem.requestFullscreen();
}

player.addEventListener("ended",()=>{
  if(currentType==="video" && currentIndex<currentList.length-1){
    currentIndex++;
    loadMedia();
  }
});

createCategories();
videoList.innerHTML="";
</script>
